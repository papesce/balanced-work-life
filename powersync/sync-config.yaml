# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
config:
  edition: 3
streams:
  # This Sync Stream has been translated from bucket definitions. There may be more efficient ways to express these queries.
  # You can add additional queries to this list if you need them.
  # For details, see the documentation: https://docs.powersync.com/sync/streams/overview
  migrated_to_streams:
    auto_subscribe: true
    queries:
      - SELECT * FROM ideas WHERE user_id = auth.user_id()
      - SELECT * FROM tags WHERE user_id = auth.user_id()
      - SELECT * FROM idea_links WHERE user_id = auth.user_id()
      - "SELECT id, idea_id, tag_id, user_id FROM task_tags WHERE user_id = auth.user_id()"
      - SELECT * FROM quick_notes WHERE user_id = auth.user_id()
      - SELECT * FROM classification_schemes WHERE user_id = auth.user_id()
      - SELECT * FROM classification_options WHERE scheme_id IN (SELECT id FROM classification_schemes WHERE user_id = auth.user_id())
      - SELECT * FROM idea_classifications WHERE user_id = auth.user_id()
